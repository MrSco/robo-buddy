<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robo Buddy Settings</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <main>
      <h1>Robo Buddy</h1>

      <section>
        <h2>Character</h2>
        <div class="pick">
          <div class="preview"><canvas id="live"></canvas></div>
          <div class="pick-controls">
            <div id="gallery" class="gallery"></div>
            <select id="character" hidden></select>
            <div class="row">
              <button id="import" type="button">Import model…</button>
              <button id="bring" type="button">Bring buddy to this screen</button>
            </div>
            <p class="hint" id="packs-hint">Click a character to preview it; click again to use it. GLB, VRM, animated WebP, GIF or PNG can be imported.</p>
          </div>
        </div>
        <label class="slider">
          <span>Size <output id="size-out">100%</output></span>
          <input id="size" type="range" min="0.5" max="2.5" step="0.05" />
        </label>
      </section>

      <section>
        <h2>Reactions</h2>
        <label class="check"><input id="paused" type="checkbox" /> Pause all reactions</label>
        <label class="check"><input id="mouse" type="checkbox" /> Watch the mouse</label>
        <label class="check"><input id="physics" type="checkbox" /> Gravity and throwing</label>
        <label class="check"><input id="music" type="checkbox" /> Dance to music</label>
        <label class="slider indent">
          <span>Music sensitivity <output id="sens-out"></output></span>
          <input id="sensitivity" type="range" min="0" max="1" step="0.01" />
        </label>
        <label class="check indent"><input id="tempo" type="checkbox" /> Only dance when a steady tempo is detected (filters game audio)</label>
        <label class="field inline indent">
          <span>Dance</span>
          <select id="dance"></select>
        </label>
        <label class="check"><input id="wander" type="checkbox" /> Wander around and fidget when idle</label>
        <details class="idleset">
          <summary>Idle moves for this character</summary>
          <div id="idleset" class="idleset-list"></div>
        </details>
        <div class="grid2">
          <label class="check"><input id="sounds" type="checkbox" /> Sounds</label>
          <label class="check"><input id="bubbles" type="checkbox" /> Speech bubbles</label>
        </div>
        <label class="field inline">
          <span>Fall asleep after</span>
          <select id="sleep">
            <option value="0">never</option>
            <option value="2">2 minutes</option>
            <option value="5">5 minutes</option>
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
          </select>
        </label>
      </section>

      <section>
        <h2>Window</h2>
        <label class="field">
          <span>Clicking</span>
          <select id="clickthrough">
            <option value="pixel">Precise: only the drawn pixels are clickable</option>
            <option value="window">Whole window is clickable</option>
            <option value="locked">Locked: never clickable (move via this window)</option>
          </select>
        </label>
        <label class="check"><input id="autostart" type="checkbox" /> Start with Windows</label>
      </section>

      <p class="status" id="status"></p>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
