[package]
name = "robo-buddy"
version = "0.7.1"
description = "A friendly robot desktop companion that dances to your music"
authors = ["rocco"]
edition = "2021"

[lib]
name = "robo_buddy_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
# One async lock, so a warm-up already in flight is waited on rather than raced.
tokio = { version = "1", features = ["sync"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rustfft = "6"
reqwest = { version = "0.13", features = ["json", "multipart"] }
keyring = { version = "3", features = ["windows-native"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_Xps", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Environment"] }
winreg = "0.55"
png = "0.17"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
